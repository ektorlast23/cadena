name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Demo TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  contracts:
    name: Contratos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  network:
    name: Red (validacion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose -f network/docker-compose.yml config --quiet
      - name: Validar entrypoint
        run: bash -n network/scripts/besu-entrypoint.sh
      - name: Validar scripts PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem network/scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

  deploy:
    name: Deploy (Ansible)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.19.5 yamllint==1.35.1
          ansible-galaxy collection install -r requirements.yml
      - name: Validar YAML
        working-directory: .
        run: yamllint -c deploy/.yamllint deploy/ansible
      - name: Syntax check
        run: ansible-playbook --syntax-check -i inventory/hosts.example.yml site.yml
      - name: Renderizar plantillas
        run: >-
          ansible-playbook -i inventory/hosts.example.yml tests/render.yml
          -e luna_hsmusers_gid=1001 -e render_dir="$RUNNER_TEMP/render"
      - name: Validar script de firewall
        run: |
          bash -n "$RUNNER_TEMP/render/cadena-docker-firewall.sh"
          shellcheck "$RUNNER_TEMP/render/cadena-docker-firewall.sh"
      - name: Validar compose renderizado
        run: docker compose -f "$RUNNER_TEMP/render/docker-compose.yml" config --quiet
      - name: Validar allowlist P2P y HOST_ALLOWLIST
        run: |
          grep -q 'P2P_SOURCES=10.20.0.11,10.20.0.12,10.20.0.13,10.20.0.14' \
            "$RUNNER_TEMP/render/cadena-docker-firewall.env"
          grep -q 'HOST_ALLOWLIST: "localhost,127.0.0.1,validator1,validator1.cadena.internal,10.20.0.11"' \
            "$RUNNER_TEMP/render/docker-compose.yml"
